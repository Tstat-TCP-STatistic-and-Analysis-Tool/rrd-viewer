user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    access_log    /dev/stdout;
    error_log     /dev/stderr;

    server {
        listen 80 default_server;
        server_name _;
        root /var/www/tstat;

        # convenience redirect so "/" lands on the tool
        location = / {
            return 302 /tstat_rrd.cgi;
        }

        location = /tstat_rrd.cgi {
            include /etc/nginx/conf.d/auth.conf;
            include fastcgi_params;
            fastcgi_pass unix:/run/fcgiwrap.socket;
            fastcgi_param SCRIPT_FILENAME /var/www/tstat/tstat_rrd.cgi;
            fastcgi_param DOCUMENT_ROOT   /var/www/tstat;
        }

        # graphs generated on the fly by the CGI
        location /rrd_images/ {
            include /etc/nginx/conf.d/auth.conf;
            alias /var/www/tstat/rrd_images/;
        }

        # "add to gallery" snapshots
        location /rrd_gallery/ {
            include /etc/nginx/conf.d/auth.conf;
            alias /var/www/tstat/rrd_gallery/;
        }

        location /javascript/ {
            alias /var/www/tstat/javascript/;
        }
    }
}
